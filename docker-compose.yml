version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wiki_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: wiki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wiki_net

  backend:
    build: .
    container_name: wiki_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db  # Имя сервиса базы данных выше
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
      - DB_NAME=wiki
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy # Ждем, пока база не будет готова принимать подключения
    volumes:
      # Монтируем папки для удобной разработки (изменения в HTML видны без пересборки)
      - ./templates:/app/templates
      - ./static:/app/static
    networks:
      - wiki_net
  
volumes:
  pgdata: # Именованный том для сохранения данных БД между перезапусками

networks:
  wiki_net:
    driver: bridge